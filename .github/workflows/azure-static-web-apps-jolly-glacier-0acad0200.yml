name: Azure Static Web Apps CI/CD

on:
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    environment: AZPROD
    name: Build and Deploy Job
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@adolf94'
           
      - name: Install dependencies and build
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd frontend
          npm install
          npm run build

      - name: Substitute JSON
        uses: restackio/update-json-file-action@2.1
        with:
          file: frontend/dist/authConfig/config.json
          fields: |
            {
              "authority": "${{ vars.VITE_OIDC_AUTHORITY }}",
              "clientId": "${{ vars.VITE_OIDC_CLIENT_ID }}",
              "redirectUri": "${{ vars.VITE_OIDC_REDIRECT_URI }}",
              "scope": "${{ vars.VITE_OIDC_SCOPE }}",
              "apiBaseUrl": "${{ vars.VITE_API_BASE }}",
              "ingesterBaseUrl": "${{vars.VITE_INGESTER_BASE_URL}}",
              "loansAppUrl": "${{ vars.VITE_LOANS_APP_URL }}"
            }

      - name: Move/Rename config.json to js
        run: |
          echo window.authConfig= > config.js
          cat config.json >> config.js
        working-directory: frontend/dist/authConfig

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_JOLLY_GLACIER_0ACAD0200 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          app_location: "/frontend/dist" # Point directly to build directory
          api_location: "" # Api source code path - optional
          output_location: "" # Empty when skipping build
          skip_app_build: true
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_JOLLY_GLACIER_0ACAD0200 }}
          action: "close"
          app_location: ""
