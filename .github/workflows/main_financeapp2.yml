# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy dotnet core project to Azure Function App - financeapp2

on:
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'backend' # set this to the path to your web app project, defaults to the repository root
  DOTNET_VERSION: '10.0' # set this to the dotnet version to use

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout
      packages: read #Required to restore NuGet packages from GitHub Packages
    
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4


      - name: Setup DotNet ${{ env.DOTNET_VERSION }} Environment
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          source-url: https://nuget.pkg.github.com/adolf94/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Resolve Project Dependencies Using Dotnet'
        shell: bash
        run: |
          pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
          dotnet build --configuration Release --output ./output
          popd
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CD55E117D4DA495AA56D8C1E45DC05B6 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_27E201BEF0494EA5AF2738C9631BD3E8 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_046B9A8E2D354D93966DBE5688F36EFD }}

      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: 'financeapp2'
          slot-name: 'Production'
          package: '${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/output'
          
      - name: Setup Python for Migrations
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Migration Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install azure-cosmos

      - name: Run Migrations
        env:
          CosmosConnectionString: ${{ secrets.COSMOS_CONNECTION_STRING }}
          COSMOS_DB: ${{ secrets.COSMOS_DB || 'FinanceDb' }}
        run: python scripts/migrate.py